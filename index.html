<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>HRB 2026 Viewer</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#0f172a;--muted:#5b6475;--line:#e3e6ec;--accent:#002060;--btn:#0061fe;--warn-bg:#fff1e6;--warn-fg:#7c2d12}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e8ecf3;--muted:#98a2b3;--line:#263042;--accent:#8fb3ff;--btn:#3d84ff;--warn-bg:#3a1d0b;--warn-fg:#fed7aa}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#viewer{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
body.ready #viewer{display:block}
body.ready #panel{display:none}
#panel{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.eyebrow{color:#2f9e44;font-weight:600;font-size:13px}
h1{margin:4px 0 8px;font-size:22px;color:var(--accent)}
p{margin:8px 0;color:var(--muted);font-size:15px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 20px;background:var(--btn);color:#fff;width:100%;margin-top:14px;cursor:pointer}
button.secondary{background:transparent;color:var(--btn);margin-top:6px}
.err{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;text-align:left}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--btn);border-radius:50%;margin:10px auto;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font-size:14px;padding:9px 14px;border-radius:999px;display:none;z-index:9}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="panel"><div class="box">
  <div class="eyebrow">HRB 2026 · Producers</div>
  <h1>Schedules + Rehearsals</h1>
  <div id="loading"><div class="spin"></div><p>Loading the latest schedule…</p></div>
  <div id="signin" hidden>
    <p>Sign in with your Dropbox account to view the live schedule. You'll stay signed in on this device.</p>
    <button id="login" type="button">Sign in with Dropbox</button>
  </div>
  <div id="error" class="err" hidden></div>
  <button id="retry" class="secondary" type="button" hidden>Try again</button>
</div></div>
<iframe id="viewer" title="HRB 2026 schedule"></iframe>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  // ---- configuration ---------------------------------------------------------------
  var APP_KEY = 'hrenzrbvo84zxc7';
  // Path inside the signed-in user's Dropbox (relative to their own folder).
  var FILE_PATH = '/HRB 2026 Viewer/HRB 2026 Schedules + Rehearsals (Live).html';
  var CHECK_EVERY_MS = 60 * 1000;
  // -------------------------------------------------------------------------------------

  var REDIRECT = location.origin + location.pathname;
  var K = { tok: 'hrbv.token', ver: 'hrbv.verifier', html: 'hrbv.html', rev: 'hrbv.rev' };
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('viewer');
  var currentRev = null;

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function show(state, msg) {
    $('loading').hidden = state !== 'loading';
    $('signin').hidden = state !== 'signin';
    $('error').hidden = !msg;
    $('error').textContent = msg || '';
    $('retry').hidden = state !== 'error';
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3500);
  }

  // ---- PKCE sign-in ------------------------------------------------------------------
  function b64url(bytes) {
    var s = ''; bytes.forEach(function (b) { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function login() {
    var verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    var challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    set(K.ver, verifier);
    location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
      client_id: APP_KEY, response_type: 'code', redirect_uri: REDIRECT,
      code_challenge: challenge, code_challenge_method: 'S256', token_access_type: 'offline'
    });
  }
  async function tokenRequest(params) {
    params.client_id = APP_KEY;
    var r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams(params) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { var e = new Error(j.error_description || j.error || ('HTTP ' + r.status)); e.auth = true; throw e; }
    return j;
  }
  async function finishLogin(code) {
    var verifier = get(K.ver);
    history.replaceState(null, '', REDIRECT);
    if (!verifier) throw new Error('Sign-in was started in a different tab. Please sign in again.');
    var j = await tokenRequest({ code: code, grant_type: 'authorization_code', code_verifier: verifier, redirect_uri: REDIRECT });
    del(K.ver);
    saveToken(j);
  }
  function saveToken(j) {
    var old = JSON.parse(get(K.tok) || '{}');
    set(K.tok, JSON.stringify({
      access: j.access_token,
      refresh: j.refresh_token || old.refresh,
      expires: Date.now() + ((j.expires_in || 14400) - 120) * 1000
    }));
  }
  async function accessToken() {
    var t = JSON.parse(get(K.tok) || 'null');
    if (!t || !t.refresh) return null;
    if (t.access && Date.now() < t.expires) return t.access;
    saveToken(await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh }));
    return JSON.parse(get(K.tok)).access;
  }
  function signOut() {
    del(K.tok); del(K.html); del(K.rev);
    document.body.classList.remove('ready');
    frame.removeAttribute('srcdoc');
    show('signin');
  }

  // ---- Dropbox file access -------------------------------------------------------------
  async function api(url, arg, asText) {
    var tok = await accessToken();
    if (!tok) { var e = new Error('signed out'); e.auth = true; throw e; }
    var headers = { Authorization: 'Bearer ' + tok };
    var opts = { method: 'POST', headers: headers };
    if (asText) headers['Dropbox-API-Arg'] = JSON.stringify(arg);
    else { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(arg); }
    var r = await fetch(url, opts);
    if (r.status === 401) { var a = new Error('Dropbox sign-in expired'); a.auth = true; throw a; }
    if (!r.ok) {
      var txt = await r.text();
      if (txt.indexOf('not_found') >= 0) throw new Error('The schedule file isn’t in this Dropbox account (' + FILE_PATH + '). Make sure you signed in with the account the Mac mini syncs to.');
      throw new Error('Dropbox error ' + r.status + ': ' + txt.slice(0, 160));
    }
    return asText ? { text: await r.text(), meta: JSON.parse(r.headers.get('Dropbox-API-Result') || '{}') } : r.json();
  }
  function render(html, rev) {
    currentRev = rev;
    frame.srcdoc = html;
    document.body.classList.add('ready');
  }
  frame.addEventListener('load', function () {
    var d = frame.contentDocument; if (!d || !d.body) return;
    // Open outside links (Dropbox "Open original") in a new tab instead of inside the frame.
    Array.prototype.forEach.call(d.querySelectorAll('a[href^="http"]'), function (a) { a.target = '_blank'; a.rel = 'noopener'; });
    var foot = d.querySelector('footer');
    if (foot && !d.getElementById('hrbv-signout')) {
      var p = d.createElement('p');
      p.innerHTML = 'Viewing via your Dropbox account. <a href="#" id="hrbv-signout">Sign out</a>';
      foot.appendChild(p);
      d.getElementById('hrbv-signout').addEventListener('click', function (ev) { ev.preventDefault(); signOut(); });
    }
  });

  async function load(quiet) {
    try {
      var f = await api('https://content.dropboxapi.com/2/files/download', { path: FILE_PATH }, true);
      set(K.html, f.text); set(K.rev, f.meta.rev || '');
      var changed = currentRev && f.meta.rev !== currentRev;
      render(f.text, f.meta.rev);
      if (changed) toast('Schedule updated');
    } catch (e) {
      if (e.auth) { signOut(); if (e.message !== 'signed out') show('signin', e.message + ' — please sign in again.'); return; }
      if (document.body.classList.contains('ready')) { if (!quiet) toast('Offline — showing the last copy'); return; }
      show('error', e.message || String(e));
    }
  }
  async function check() {
    if (document.hidden || !currentRev) return;
    try {
      var m = await api('https://api.dropboxapi.com/2/files/get_metadata', { path: FILE_PATH });
      if (m.rev && m.rev !== currentRev) await load(true);
    } catch (e) { if (e.auth) signOut(); }
  }

  // ---- start -----------------------------------------------------------------------------
  $('login').addEventListener('click', function () { login().catch(function (e) { show('signin', e.message); }); });
  $('retry').addEventListener('click', function () { show('loading'); load(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, CHECK_EVERY_MS);

  (async function start() {
    if (APP_KEY.indexOf('__') === 0) { show('error', 'This page has no Dropbox app key configured yet.'); return; }
    var q = new URLSearchParams(location.search);
    try {
      if (q.get('error')) { history.replaceState(null, '', REDIRECT); show('signin', 'Dropbox sign-in was cancelled.'); return; }
      if (q.get('code')) await finishLogin(q.get('code'));
    } catch (e) { show('signin', e.message); return; }
    if (!get(K.tok)) { show('signin'); return; }
    var cached = get(K.html);
    if (cached) render(cached, get(K.rev));   // instant open, then refresh
    show('loading');
    load(!!cached);
  })();
})();
</script>
</body>
</html>
