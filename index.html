<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>HRB 2026 Viewer</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#0f172a;--muted:#5b6475;--line:#e3e6ec;--accent:#002060;--btn:#0061fe;--warn-bg:#fff1e6;--warn-fg:#7c2d12}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--fg:#e8ecf3;--muted:#98a2b3;--line:#263042;--accent:#8fb3ff;--btn:#3d84ff;--warn-bg:#3a1d0b;--warn-fg:#fed7aa}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#viewer{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
body.ready #viewer{display:block}
body.ready #panel{display:none}
#panel{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.eyebrow{color:#2f9e44;font-weight:600;font-size:13px}
h1{margin:4px 0 8px;font-size:22px;color:var(--accent)}
p{margin:8px 0;color:var(--muted);font-size:15px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 20px;background:var(--btn);color:#fff;width:100%;margin-top:14px;cursor:pointer}
button.secondary{background:transparent;color:var(--btn);margin-top:6px}
.err{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;text-align:left}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--btn);border-radius:50%;margin:10px auto;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font-size:14px;padding:9px 14px;border-radius:999px;display:none;z-index:9}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="panel"><div class="box">
  <div class="eyebrow">HRB 2026 · Producers</div>
  <h1>Schedules + Rehearsals</h1>
  <div id="loading"><div class="spin"></div><p id="status">Loading the latest schedule…</p></div>
  <div id="signin" hidden>
    <p>Sign in with the Dropbox account that has the HRB 2026 shared folder. You'll stay signed in on this device.</p>
    <button id="login" type="button">Sign in with Dropbox</button>
  </div>
  <div id="error" class="err" hidden></div>
  <button id="retry" class="secondary" type="button" hidden>Try again</button>
</div></div>
<iframe id="viewer" title="HRB 2026 schedule"></iframe>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script>
(function () {
  'use strict';
  // ---- configuration ---------------------------------------------------------------
  var APP_KEY = 'hrenzrbvo84zxc7';
  // The producers spreadsheet, as named in the shared folder. Each person's copy of the shared
  // folder can sit anywhere in their Dropbox, so the page finds it by name.
  var XLSX_NAME = 'Schedules+Rehearsals2026_Producers.xlsx';
  // The show is in Anaheim: all stamps and the "Now" highlight use Pacific time on every device.
  var EVENT_TZ = 'America/Los_Angeles';
  var PAGE = { title: 'Schedules + Rehearsals', eyebrow: 'HRB 2026 · Producers', source_label: 'Dropbox', host_label: 'this device', display_tz: EVENT_TZ };
  var CHECK_EVERY_MS = 60 * 1000;
  // Bump whenever the page or py/build_viewer.py changes: devices then rebuild their saved copy
  // once (no sign-in needed) instead of waiting for the next spreadsheet edit.
  var BUILD_ID = '2026-10-16.pacific';
  var KEEP_BATCHES = 40;
  // -------------------------------------------------------------------------------------

  var REDIRECT = location.origin + location.pathname;
  var K = { tok: 'hrbv.token', ver: 'hrbv.verifier', html: 'hrbv.html2', rev: 'hrbv.rev2', path: 'hrbv.xlsxpath',
            model: 'hrbv.model', batches: 'hrbv.batches', changedAt: 'hrbv.changedAt', build: 'hrbv.build' };
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('viewer');
  var currentRev = null;
  var xlsxPath = get(K.path);

  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function show(state, msg) {
    $('loading').hidden = state !== 'loading';
    $('signin').hidden = state !== 'signin';
    $('error').hidden = !msg;
    $('error').textContent = msg || '';
    $('retry').hidden = state !== 'error';
  }
  function status(msg) { $('status').textContent = msg; }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3500);
  }
  // ISO timestamp with the event zone's wall time and UTC offset, e.g. 2026-10-18T09:15:00-07:00.
  function zoneParts(d) {
    var p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: EVENT_TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  function localIso(d) {
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var p = zoneParts(d);
    var wall = Date.UTC(+p.year, p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
    var off = Math.round((wall - Math.floor(d.getTime() / 1000) * 1000) / 60000), sign = off >= 0 ? '+' : '-'; off = Math.abs(off);
    return p.year + '-' + p.month + '-' + p.day + 'T' + pad(+p.hour % 24) + ':' + p.minute + ':' + p.second +
      sign + pad(Math.floor(off / 60)) + ':' + pad(off % 60);
  }
  function tzName() { try { return zoneParts(new Date()).timeZoneName || ''; } catch (e) { return ''; } }

  // ---- PKCE sign-in ------------------------------------------------------------------
  function b64url(bytes) {
    var s = ''; bytes.forEach(function (b) { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  async function login() {
    var verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    var challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    set(K.ver, verifier);
    location.href = 'https://www.dropbox.com/oauth2/authorize?' + new URLSearchParams({
      client_id: APP_KEY, response_type: 'code', redirect_uri: REDIRECT,
      code_challenge: challenge, code_challenge_method: 'S256', token_access_type: 'offline'
    });
  }
  async function tokenRequest(params) {
    params.client_id = APP_KEY;
    var r = await fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', body: new URLSearchParams(params) });
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { var e = new Error(j.error_description || j.error || ('HTTP ' + r.status)); e.auth = true; throw e; }
    return j;
  }
  async function finishLogin(code) {
    var verifier = get(K.ver);
    history.replaceState(null, '', REDIRECT);
    if (!verifier) throw new Error('Sign-in was started in a different tab. Please sign in again.');
    var j = await tokenRequest({ code: code, grant_type: 'authorization_code', code_verifier: verifier, redirect_uri: REDIRECT });
    del(K.ver);
    saveToken(j);
  }
  function saveToken(j) {
    var old = JSON.parse(get(K.tok) || '{}');
    set(K.tok, JSON.stringify({
      access: j.access_token,
      refresh: j.refresh_token || old.refresh,
      expires: Date.now() + ((j.expires_in || 14400) - 120) * 1000
    }));
  }
  async function accessToken() {
    var t = JSON.parse(get(K.tok) || 'null');
    if (!t || !t.refresh) return null;
    if (t.access && Date.now() < t.expires) return t.access;
    saveToken(await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh }));
    return JSON.parse(get(K.tok)).access;
  }
  function signOut() {
    [K.tok, K.html, K.rev, K.path, K.model, K.batches, K.changedAt].forEach(del);
    xlsxPath = null; currentRev = null;
    document.body.classList.remove('ready');
    frame.removeAttribute('srcdoc');
    show('signin');
  }

  // ---- Dropbox file access -------------------------------------------------------------
  async function api(url, arg, binary) {
    var tok = await accessToken();
    if (!tok) { var e = new Error('signed out'); e.auth = true; throw e; }
    var headers = { Authorization: 'Bearer ' + tok };
    var opts = { method: 'POST', headers: headers };
    if (binary) headers['Dropbox-API-Arg'] = JSON.stringify(arg);
    else { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(arg); }
    var r = await fetch(url, opts);
    if (r.status === 401) { var a = new Error('Dropbox sign-in expired'); a.auth = true; throw a; }
    if (!r.ok) {
      var txt = await r.text();
      if (txt.indexOf('not_found') >= 0) { var nf = new Error('not found'); nf.notFound = true; throw nf; }
      throw new Error('Dropbox error ' + r.status + ': ' + txt.slice(0, 160));
    }
    if (!binary) return r.json();
    return { bytes: new Uint8Array(await r.arrayBuffer()), meta: JSON.parse(r.headers.get('Dropbox-API-Result') || '{}') };
  }
  // Find the spreadsheet in this person's Dropbox (their copy of the shared folder).
  async function findXlsx() {
    status('Looking for the schedule in your Dropbox…');
    var r = await api('https://api.dropboxapi.com/2/files/search_v2', {
      query: XLSX_NAME, options: { filename_only: true, file_extensions: ['xlsx'], max_results: 25 }
    });
    var hits = (r.matches || []).map(function (m) { return m.metadata && m.metadata.metadata; })
      .filter(function (md) { return md && md['.tag'] === 'file' && md.name.toLowerCase() === XLSX_NAME.toLowerCase(); })
      .sort(function (a, b) { return (b.server_modified || '').localeCompare(a.server_modified || ''); });
    if (!hits.length) throw new Error('Couldn’t find “' + XLSX_NAME + '” in this Dropbox account. Sign in with the account that has the HRB 2026 shared folder (Sign out is at the bottom of the schedule), or check the folder has been added to your Dropbox.');
    xlsxPath = hits[0].path_lower; set(K.path, xlsxPath);
  }
  async function metadata() {
    if (!xlsxPath) await findXlsx();
    try { return await api('https://api.dropboxapi.com/2/files/get_metadata', { path: xlsxPath }); }
    catch (e) { if (!e.notFound) throw e; await findXlsx(); return api('https://api.dropboxapi.com/2/files/get_metadata', { path: xlsxPath }); }
  }

  // ---- building the viewer on this device ------------------------------------------------
  var pyReady = null;
  function python() {
    if (!pyReady) pyReady = (async function () {
      status('Preparing the viewer (first time takes a few seconds)…');
      var py = await loadPyodide();
      await py.loadPackage('micropip');
      var base = new URL('py/', location.href).href;
      await py.runPythonAsync('import micropip\nawait micropip.install(["' + base + 'et_xmlfile-2.0.0-py3-none-any.whl", "' + base + 'openpyxl-3.1.5-py2.py3-none-any.whl"])');
      var src = await (await fetch(base + 'build_viewer.py', { cache: 'no-cache' })).text();
      py.FS.writeFile('/home/pyodide/build_viewer.py', src);
      py.runPython('import sys\nsys.path.insert(0, "/home/pyodide")\nimport build_viewer');
      return py;
    })();
    return pyReady;
  }
  var GLUE = [
    'import json, io, datetime as dt, build_viewer as bv',
    'model = bv.load_model(io.BytesIO(bytes(xlsx_bytes.to_py())))',
    'old = json.loads(old_model) if old_model else None',
    'batches = json.loads(old_batches or "[]")',
    'now = dt.datetime.fromisoformat(now_iso)',
    'changes = bv.diff_models(old, model)',
    'if changes: batches.insert(0, {"at": now_iso, "changes": changes})',
    'batches = batches[:keep]',
    'recent = [c for b in batches if now - dt.datetime.fromisoformat(b["at"]) <= dt.timedelta(hours=24) for c in b["changes"]]',
    'meta = dict(json.loads(page_meta), checked_at=now_iso, changed_at=changed_iso, change_batches=batches, recent_changes=recent, error=None)',
    'json.dumps({"html": bv.render(model, meta), "model": json.dumps(model), "batches": json.dumps(batches), "changes": len(changes)})'
  ].join('\n');
  async function build(bytes, meta) {
    var py = await python();
    status('Building the schedule…');
    var g = py.globals;
    g.set('xlsx_bytes', bytes);
    g.set('old_model', get(K.model));
    g.set('old_batches', get(K.batches));
    g.set('now_iso', localIso(new Date()));
    g.set('changed_iso', meta.server_modified ? localIso(new Date(meta.server_modified)) : localIso(new Date()));
    g.set('page_meta', JSON.stringify(Object.assign({ tz: tzName(), dropbox_url: 'https://www.dropbox.com/home' + encodeURI((meta.path_display || '').replace(/\/[^/]*$/, '')) }, PAGE)));
    g.set('keep', KEEP_BATCHES);
    var out = JSON.parse(await py.runPythonAsync(GLUE));
    set(K.model, out.model); set(K.batches, out.batches);
    return out;
  }

  function render(html, rev) {
    currentRev = rev;
    frame.srcdoc = html;
    document.body.classList.add('ready');
  }
  frame.addEventListener('load', function () {
    var d = frame.contentDocument; if (!d || !d.body) return;
    Array.prototype.forEach.call(d.querySelectorAll('a[href^="http"]'), function (a) { a.target = '_blank'; a.rel = 'noopener'; });
    var foot = d.querySelector('footer');
    if (foot && !d.getElementById('hrbv-signout')) {
      var p = d.createElement('p');
      p.innerHTML = 'Built on this device from the spreadsheet in your Dropbox. <a href="#" id="hrbv-signout">Sign out</a>';
      foot.appendChild(p);
      d.getElementById('hrbv-signout').addEventListener('click', function (ev) { ev.preventDefault(); signOut(); });
    }
  });

  var busy = false;
  async function refresh(quiet) {
    if (busy) return; busy = true;
    try {
      var meta = await metadata();
      if (meta.rev && meta.rev === get(K.rev) && get(K.html) && get(K.build) === BUILD_ID) {
        if (currentRev !== meta.rev) render(get(K.html), meta.rev);
        return;
      }
      status('Downloading the latest spreadsheet…');
      var f = await api('https://content.dropboxapi.com/2/files/download', { path: xlsxPath }, true);
      var out = await build(f.bytes, Object.assign({}, meta, f.meta));
      var wasShowing = !!currentRev && get(K.build) === BUILD_ID;
      set(K.html, out.html); set(K.rev, f.meta.rev || meta.rev || ''); set(K.build, BUILD_ID);
      render(out.html, f.meta.rev || meta.rev);
      if (wasShowing) toast(out.changes ? 'Schedule updated · ' + out.changes + ' change' + (out.changes === 1 ? '' : 's') : 'Schedule updated');
    } catch (e) {
      if (e.auth) { signOut(); if (e.message !== 'signed out') show('signin', e.message + ' — please sign in again.'); return; }
      if (document.body.classList.contains('ready')) { if (!quiet) toast('Offline — showing the last copy'); return; }
      show('error', e.message || String(e));
    } finally { busy = false; }
  }

  // ---- start -----------------------------------------------------------------------------
  $('login').addEventListener('click', function () { login().catch(function (e) { show('signin', e.message); }); });
  $('retry').addEventListener('click', function () { show('loading'); status('Loading the latest schedule…'); refresh(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(true); });
  setInterval(function () { if (!document.hidden) refresh(true); }, CHECK_EVERY_MS);

  (async function start() {
    var q = new URLSearchParams(location.search);
    try {
      if (q.get('error')) { history.replaceState(null, '', REDIRECT); show('signin', 'Dropbox sign-in was cancelled.'); return; }
      if (q.get('code')) await finishLogin(q.get('code'));
    } catch (e) { show('signin', e.message); return; }
    if (!get(K.tok)) { show('signin'); return; }
    var cached = get(K.html);
    if (cached) render(cached, get(K.rev));   // instant open, then check for a newer spreadsheet
    show('loading');
    refresh(!!cached);
  })();
})();
</script>
</body>
</html>
